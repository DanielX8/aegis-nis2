[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-nis2"
version = "0.1.0"
description = "NIS2-compliant CSIRT triage, host quarantine, and Article 23 regulatory reporting pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cybersecurity", "nis2", "csirt", "incident-response", "siem"]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "rich>=13.7",
    "flask>=3.0",
    "pyyaml>=6.0",
    "stix2>=3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
